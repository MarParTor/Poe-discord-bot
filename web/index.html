<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <icon rel="icon" href="pfp.png" type="image/png">
        <title>Poe Bot</title>
</head>

<body>
    <main>
        <section class="hero">
            <p class="eyebrow">Bot de Discord</p>
            <div class="hero-title">
                <h1>Poe</h1>
                <img src="pfp.png" alt="Poe Bot Avatar" class="avatar">
            </div>
            <p class="lead">
                Poe es un bot de Discord simple que scrapea la web <a href="https://www.poemas-del-alma.com"
                    target="_blank" rel="noopener noreferrer">poemas del alma</a> y devuelve poemas desde esta. </p>
        </section>
        <section class="info">
            <div>
                <p class="actions">
                    <a class="button"
                        href="https://discord.com/oauth2/authorize?client_id=1533937800683061360&permissions=10240&integration_type=0&scope=bot"
                        target="_blank" rel="noopener noreferrer">
                        Añadir Poe a tu servidor
                    </a>
                </p>
            </div>
        </section>
    </main>
</body>

</html>
